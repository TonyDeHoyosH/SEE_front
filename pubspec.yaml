name: awos
description: "AWOS - Mental health MVP application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # HTTP Client
  http: ^1.1.2
  
  # Local Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  
  # Audio
  record: 5.0.4
  audioplayers: ^6.1.0
  
  # Permissions
  permission_handler: ^11.1.0
  
  # Utilities
  intl: ^0.18.1
  
  # UI
  google_fonts: ^6.1.0
  image_picker: ^1.0.7
  url_launcher: ^6.2.5
  flutter_slidable: ^4.0.3
  dio: ^5.9.1
  flutter_dotenv: ^6.0.0
  connectivity_plus: ^6.0.5
  google_sign_in: ^7.2.0
  cached_network_image: ^3.4.1
  open_filex: ^4.7.0
  flutter_secure_storage: ^10.0.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/emojis/

dependency_overrides:
  record_platform_interface: 1.2.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
